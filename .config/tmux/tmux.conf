unbind r
bind r source-file ~/.config/tmux/tmux.conf

set-option -sa terminal-overrides ",xterm*:Tc"
set-option -g status-position top
set-option -g default-command "${SHELL} -i"
set -g mouse on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
# Vim style pane selection

bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel clip.exe

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Handle Ctrl+numbers
bind-key -n C-1 send-keys C-1
bind-key -n C-2 send-keys C-2
bind-key -n C-3 send-keys C-3
bind-key -n C-4 send-keys C-4
bind-key -n C-5 send-keys C-5
bind-key -n C-6 send-keys C-6
bind-key -n C-7 send-keys C-7
bind-key -n C-8 send-keys C-8
bind-key -n C-9 send-keys C-9

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'fabioluciano/tmux-tokyo-night'


### Enable transparency
set -g @theme_left_separator ''
set -g @theme_right_separator ''
set -g @theme_transparent_status_bar 'true'
set -g @theme_transparent_left_separator_inverse ''
set -g @theme_transparent_right_separator_inverse ''
set -g @theme_plugins 'datetime'

run '~/.config/tmux/plugins/tpm/tpm'
