"$schema" = 'https://starship.rs/config-schema.json'
format = """
[](color1)\
$os\
$username\
[](bg:color8 fg:color1)\
$directory\
[](bg:color9 fg:color8)\
$git_branch\
$git_status\
[](fg:color9 bg:color3)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color3 bg:color5)\
$conda\
[](fg:color5 bg:color2)\
$time\
[  ](fg:color2)\
$cmd_duration\
$line_break\
$character"""

palette = 'colors'
[palettes.colors]
color1 = '#a0daa9'
color2 = '#511d3d'
color3 = '#d4c2c8'
color4 = '#251d21'
color5 = '#511d3d'
color6 = '#181115'
color7 = '#181115'
color8 = '#fbb0d7'
color9 = '#9F90CF'

[os]
disabled = false
style = "bg:color1 fg:color6"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
Macos = "󰀵"

[username]
show_always = true
style_user = "bg:color1 fg:color6"
style_root = "bg:color1 fg:color6"
format = '[ $user]($style)'

[directory]
style = "bg:color8 fg:color6"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color9"
format = '[[ $symbol $branch ](fg:color6 bg:color9)]($style)'

[git_status]
style = "bg:color9"
format = '[[($all_status$ahead_behind )](fg:color6 bg:color9)]($style)'

[nodejs]
symbol = ""
style = "bg:color3"
format = '[[ $symbol( $version) ](fg:color6 bg:color3)]($style)'

[c]
symbol = " "
style = "bg:color3"
format = '[[ $symbol( $version) ](fg:color6 bg:color3)]($style)'

[rust]
symbol = ""
style = "bg:color3"
format = '[[ $symbol( $version) ](fg:color6 bg:color3)]($style)'

[golang]
symbol = ""
style = "bg:color3"
format = '[[ $symbol( $version) ](fg:color6 bg:color3)]($style)'

[php]
symbol = ""
style = "bg:color3"
format = '[[ $symbol( $version) ](fg:color6 bg:color3)]($style)'

[java]
symbol = ""
style = "bg:color3"
format = '[[ $symbol( $version) ](fg:color6 bg:color3)]($style)'

[kotlin]
symbol = ""
style = "bg:color3"
format = '[[ $symbol( $version) ](fg:color6 bg:color3)]($style)'

[haskell]
symbol = ""
style = "bg:color3"
format = '[[ $symbol( $version) ](fg:color6 bg:color3)]($style)'

[python]
symbol = ""
style = "bg:color3"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:color6 bg:color3)]($style)'

[docker_context]
symbol = ""
style = "bg:color5"
format = '[[ $symbol( $context) ](fg:color6 bg:color5)]($style)'

[conda]
symbol = "   "
style = "fg:color6 bg:color5"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:color2"
format = '[[   $time ](fg:color6 bg:color2)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:color8)'
error_symbol = '[❯](bold fg:color9)'
vimcmd_symbol = '[❮](bold fg:color8)'
vimcmd_replace_one_symbol = '[❮](bold fg:color2)'
vimcmd_replace_symbol = '[❮](bold fg:color2)'
vimcmd_visual_symbol = '[❮](bold fg:color9)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:color2"
disabled = false
show_notifications = true
min_time_to_notify = 45000
